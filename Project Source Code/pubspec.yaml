name: drone_delivery_simulation
description: A modern animated Drone Delivery System Simulation built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^0.68.0

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.0

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # If you add Google Fonts via pub, fonts are fetched at runtime.
  # We bundle nothing extra here so the app stays fully offline-capable.